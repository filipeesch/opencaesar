<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roman City Builder</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #2b1d0e;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      #game canvas {
        display: block;
      }

      /* ---- HUD overlay ---- */
      #hud {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        width: 260px;
        padding: 8px;
        box-sizing: border-box;
        color: #f3e9d2;
        user-select: none;
        pointer-events: none;
        max-height: 100vh;
        overflow-y: auto;
      }
      #hud .hud-panel,
      #hud .hud-toast,
      #hud .hud-control-bar {
        pointer-events: auto;
      }
      .hud-panel {
        background: rgba(40, 28, 14, 0.9);
        border: 1px solid #7a6234;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .hud-title {
        font-size: 15px;
        font-weight: bold;
        color: #e8c46b;
        margin-bottom: 6px;
        letter-spacing: 1px;
      }
      .hud-subtitle {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #b39a62;
        margin-bottom: 6px;
      }
      .hud-stat {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        padding: 2px 0;
      }
      .hud-stat b {
        color: #e8c46b;
      }
      .hud-build-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .hud-build-btn {
        font: inherit;
        font-size: 12px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 5px 4px;
        cursor: pointer;
        text-align: left;
      }
      .hud-build-btn:hover {
        background: #5d4420;
      }
      .hud-build-btn.active {
        background: #7a5c22;
        border-color: #e8c46b;
      }
      .hud-policy label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        padding: 2px 0;
      }
      .hud-policy input[type='range'] {
        width: 110px;
      }
      .hud-log ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 180px;
        overflow-y: auto;
        font-size: 12px;
      }
      .hud-log li {
        padding: 2px 0;
        border-bottom: 1px dotted rgba(243, 233, 210, 0.15);
      }
      .msg-house-evolved {
        color: #8bd46f;
      }
      .msg-house-devolved {
        color: #e09070;
      }
      .msg-building-inactive {
        color: #d0b080;
      }
      .msg-building-active {
        color: #7fc4e8;
      }
      .msg-warning {
        color: #e8c46b;
      }
      .hud-toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(30, 20, 10, 0.95);
        border: 1px solid #c06040;
        border-radius: 6px;
        color: #ffd9c0;
        padding: 8px 16px;
        font-size: 14px;
        z-index: 20;
      }
      .hud-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        min-width: 220px;
        max-width: 320px;
        max-height: 80vh;
        overflow-y: auto;
        background: rgba(40, 28, 14, 0.95);
        border: 1px solid #e8c46b;
        border-radius: 6px;
        color: #f3e9d2;
        padding: 10px 12px;
        z-index: 30;
        font-size: 13px;
        pointer-events: auto;
      }
      .hud-popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #7a6234;
        margin-bottom: 6px;
        padding-bottom: 4px;
      }
      .hud-popup-title {
        color: #e8c46b;
        font-weight: bold;
      }
      .hud-popup-close {
        background: none;
        border: none;
        color: #b39a62;
        font-size: 16px;
        cursor: pointer;
        padding: 0 2px;
      }
      .hud-popup-close:hover {
        color: #f3e9d2;
      }
      .hud-popup .row {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      .hud-popup .row b {
        color: #e8c46b;
        font-weight: normal;
      }
      .hud-popup .ok {
        color: #8bd46f;
      }
      .hud-popup .bad {
        color: #e09070;
      }
      .hud-pause-btn {
        position: fixed;
        top: 8px;
        left: 12px;
        z-index: 15;
        pointer-events: auto;
        font-size: 14px;
        color: #f3e9d2;
        background: rgba(40, 28, 14, 0.9);
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }

      /* ---- Management UI (Phase 18) ---- */
      .hud-control-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .hud-control-btn {
        flex: 1;
        font: inherit;
        font-size: 12px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 6px 4px;
        cursor: pointer;
      }
      .hud-control-btn:hover {
        background: #5d4420;
      }
      .hud-control-btn:active {
        background: #7a5c22;
      }
      .hud-build-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hud-log.active {
        border-color: #e8c46b;
      }
      .advisor-drawer {
        position: fixed;
        bottom: 132px;
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, 90vw);
        max-height: 40vh;
        overflow-y: auto;
        z-index: 25;
        background: rgba(40, 28, 14, 0.95);
        border: 1px solid #7a6234;
        border-radius: 6px;
        padding: 8px 12px;
        color: #f3e9d2;
        pointer-events: auto;
      }
      .overlay-bar {
        position: fixed;
        bottom: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 24;
        background: rgba(40, 28, 14, 0.95);
        border: 1px solid #7a6234;
        border-radius: 6px;
        padding: 8px 12px;
        color: #f3e9d2;
        pointer-events: auto;
      }
      .overlay-toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .overlay-toggle {
        min-height: 32px;
        font: inherit;
        font-size: 12px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .overlay-toggle:hover {
        background: #5d4420;
      }
      .overlay-toggle.active {
        background: #7a5c22;
        border-color: #e8c46b;
        color: #e8c46b;
      }
      .overlay-toggle .shortcut {
        color: #b39a62;
        margin-left: 4px;
        font-size: 11px;
      }
      .overlay-toggle.active .shortcut {
        color: #e8c46b;
      }
      .overlay-legend {
        position: fixed;
        bottom: 64px;
        right: 280px;
        z-index: 24;
        min-width: 180px;
        background: rgba(40, 28, 14, 0.95);
        border: 1px solid #7a6234;
        border-radius: 6px;
        padding: 8px 12px;
        color: #f3e9d2;
        font-size: 12px;
        /* Display-only readout — never intercepts clicks (T-18-04). */
        pointer-events: none;
      }
      .overlay-legend .hud-subtitle {
        margin-bottom: 4px;
      }
      .overlay-legend .legend-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      .overlay-legend .legend-swatch {
        width: 16px;
        height: 12px;
        border: 1px solid rgba(243, 233, 210, 0.3);
        border-radius: 2px;
      }
      .advisor-tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        max-width: 100%;
        padding-bottom: 6px;
        margin-bottom: 6px;
        border-bottom: 1px solid #7a6234;
      }
      .advisor-tab {
        min-height: 32px;
        font: inherit;
        font-size: 12px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      .advisor-tab:hover {
        background: #5d4420;
      }
      .advisor-tab.active {
        background: #7a5c22;
        border-color: #e8c46b;
        color: #e8c46b;
      }
      .advisor-panel {
        font-size: 12px;
      }
      .advisor-panel .row {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      .advisor-panel .row b {
        color: #e8c46b;
        font-weight: normal;
      }
      .advisor-alerts {
        margin: 6px 0;
      }
      .advisor-alerts li {
        color: #e8c46b;
      }
      .advisor-action {
        margin-top: 6px;
        font: inherit;
        font-size: 12px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      .advisor-action:hover {
        background: #5d4420;
      }
      .hud-popup .inspector-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding-top: 6px;
        border-top: 1px solid #7a6234;
      }
      .hud-popup .inspector-nav button {
        font: inherit;
        font-size: 13px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
      }
      .hud-popup .inspector-nav button:hover {
        background: #5d4420;
      }
      .hud-popup .inspector-nav button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .hud-popup .inspector-nav .inspector-nav-label {
        color: #b39a62;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .hud-popup .hud-overlay-title {
        color: #e8c46b;
      }
      .hud-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: auto;
        background: rgba(10, 6, 3, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .hud-overlay-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(40, 28, 14, 0.97);
        border: 1px solid #e8c46b;
        border-radius: 8px;
        padding: 20px 28px;
        min-width: 200px;
      }
      .hud-overlay-title {
        color: #e8c46b;
        font-size: 20px;
        text-align: center;
        margin-bottom: 6px;
        letter-spacing: 1px;
      }

      /* ---- Home screen ---- */
      .home {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #3a2c18, #1c140a 70%);
        color: #f3e9d2;
      }
      .home-title {
        color: #e8c46b;
        font-size: 34px;
        margin: 0 0 18px;
        letter-spacing: 2px;
      }
      .home-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 340px;
      }
      .home-section {
        background: rgba(40, 28, 14, 0.9);
        border: 1px solid #7a6234;
        border-radius: 8px;
        padding: 12px 14px;
      }
      .home-section-title {
        color: #b39a62;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .home-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .home-row input[type='number'] {
        width: 90px;
        font: inherit;
        padding: 3px 6px;
        color: #f3e9d2;
        background: #2b1d0e;
        border: 1px solid #7a6234;
        border-radius: 4px;
      }
      .home-btn {
        width: 100%;
        font: inherit;
        font-size: 14px;
        color: #f3e9d2;
        background: #4a3517;
        border: 1px solid #7a6234;
        border-radius: 4px;
        padding: 7px;
        cursor: pointer;
      }
      .home-btn:hover {
        background: #5d4420;
      }
      .home-btn.primary {
        background: #7a5c22;
        border-color: #e8c46b;
      }
      .home-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .home-section p {
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
        color: #d9ceb2;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
